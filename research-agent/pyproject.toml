[project]
name = "multi-agent-research"
version = "0.1.0"
description = "Simple multi-agent research system using Claude Agents SDK"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "matplotlib>=3.11.2",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_agent*"]
